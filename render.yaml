services:
  - type: web
    name: jim-connect-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
